name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:migrations
      - run: npm run test:hygiene
      - run: npm audit --omit=dev --audit-level=high
      - name: Licencias de dependencias de producción (P1.8)
        run: npm run licenses
      - name: SBOM (CycloneDX)
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cyclonedx.json, retention-days: 90 }
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - name: Presupuesto de bundle (P2 · F2)
        run: npm run check:bundle

  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: deno check (Edge Functions)
        working-directory: supabase/functions
        # Gap pre-existente documentado (web_search_20260209 en
        # generar-estudio-mercado, docs P0 §7) — no bloquea.
        run: deno check $(git ls-files '*.ts') || true

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # test:coverage corre los mismos tests unitarios + falla si la
      # cobertura de los módulos de src/lib bajo prueba cae del umbral
      # (.c8rc.json). P1.3 — "CI debe fallar si cae cobertura".
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 14 }

  supabase-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: npm ci

      - name: Levantar Supabase local
        run: supabase start -x imgproxy,vector

      - name: Exportar credenciales locales
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Tipos de Supabase al día (P1.4)
        # Regenera los tipos desde el esquema real (todas las migraciones
        # aplicadas por `supabase start`) y falla si el archivo committeado
        # quedó desincronizado respecto a las migraciones.
        run: |
          npm run typegen
          git diff --exit-code src/lib/supabase/database.types.ts \
            || { echo "::error::database.types.ts desactualizado — corre 'npm run typegen' y commitea"; exit 1; }

      - name: Esperar a las Edge Functions
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              "$SUPABASE_URL/functions/v1/job-worker" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
            [ "$code" = "200" ] && { echo "worker OK"; break; }
            sleep 2
          done

      - name: Tests de integración
        run: npm run test:integration

      - name: Instalar navegador Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, contra Supabase local)
        # --forbid-only: un test.only olvidado hace fallar CI en vez de
        # pasar ejecutando una sola prueba (P1.3).
        run: npx playwright test --forbid-only
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report/, retention-days: 14 }
      - if: always()
        run: supabase stop --no-backup || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
