name: Deploy · staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_REF: ${{ secrets.STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - run: npm ci

      - name: Verificaciones rápidas
        run: npm run check

      - name: Verificar migraciones contra una base limpia
        run: |
          supabase stop --no-backup || true
          supabase db start
          supabase db reset --local --no-seed
          supabase stop --no-backup || true

      - name: Aplicar migraciones a staging
        run: |
          supabase link --project-ref "$STAGING_REF"
          supabase db push

      - name: Desplegar Edge Functions a staging
        run: supabase functions deploy --project-ref "$STAGING_REF"

      - name: Desplegar app a Vercel (staging)
        run: |
          npm i -g vercel@latest
          # --git-branch=staging trae las env vars scoped a la rama staging
          # (Supabase de staging), no las de preview genéricas.
          vercel pull --yes --environment=preview --git-branch=staging --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN")
          vercel alias set "$URL" "${{ vars.STAGING_ALIAS }}" --token="$VERCEL_TOKEN" || true
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke test
        run: node scripts/smoke.mjs "$DEPLOY_URL"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
